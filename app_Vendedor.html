<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ · Vendedor</title>
<style>
:root{--green:#157347;--green-dark:#0b432b;--lime:#dff2e6;--ink:#1f2937;--muted:#667085;--line:#d0d5dd;--bg:#f1f5f3;--card:#fff;--amber:#fff5d6;--amber-line:#e3b341;--red:#b42318;--shadow:0 12px 26px #102a1d12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:850px;margin:auto;padding:20px 15px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(145deg,#2cac64,#0b432b);display:grid;place-items:center;color:white;font-weight:900;font-size:18px}.eyebrow{color:var(--green);text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:.08em}h1{margin:0;font-size:22px}.card{background:var(--card);border:1px solid #e3e7e5;border-radius:17px;padding:19px;box-shadow:var(--shadow);margin-bottom:17px}.title{display:flex;align-items:center;gap:9px;margin:0 0 15px;font-size:16px}.num{width:24px;height:24px;border-radius:7px;background:var(--lime);color:var(--green-dark);display:grid;place-items:center;font-weight:900;font-size:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:10px;font-weight:900;text-transform:uppercase;color:#475467;letter-spacing:.03em}input,select,textarea{width:100%;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;outline:none}textarea{min-height:60px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:900;font-size:13px;cursor:pointer;transition:transform .16s}.btn:active{transform:scale(.97)}.primary{background:var(--green);color:#fff}.secondary{background:var(--lime);color:var(--green-dark)}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.products table{border-collapse:collapse;width:100%}.products th{background:#f4f8f5;font-size:10px;padding:9px;text-align:left}.products td{padding:7px;border-top:1px solid #e8eeea}.row-remove{color:var(--red);cursor:pointer;border:0;background:transparent;font-weight:900}.status-badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase}.status-devuelto{background:#fdf2f2;color:#9b1c1c}.status-entregado{background:#def7ec;color:#03543f}.list-item{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;background:#fff}.list-item:hover{background:var(--lime)}.result{display:none;margin-top:13px;background:#eef8f1;border:1px solid #a9d9b8;padding:12px;border-radius:10px;font-weight:600;color:var(--green-dark)}@media(max-width:600px){.fields{grid-template-columns:1fr}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="logo">DJ</div><div><div class="eyebrow">Distribuciones Johnson</div><h1>App Vendedor</h1></div></div></header>
<section class="card"><h2 class="title"><span class="num">!</span>Pedidos Devueltos (Acción Requerida)</h2><div id="devueltosList"></div></section>
<section class="card"><h2 class="title"><span class="num">1</span>Datos del Cliente</h2><div class="fields"><div class="field"><label>Consecutivo</label><input id="consecutive" readonly></div><div class="field"><label>NIT</label><input id="nit" placeholder="Ingrese NIT"></div><div class="field full"><label>Razón Social</label><input id="name"></div><div class="field full"><label>Dirección</label><input id="address"></div><div class="field"><label>Ciudad</label><input id="city"></div><div class="field"><label>Barrio</label><input id="neighborhood"></div><div class="field"><label>Teléfono</label><input id="phone"></div><div class="field"><label>Lista Precios</label><select id="priceList"><option value="1">Precio 1</option><option value="2">Precio 2</option><option value="3">Precio 3</option></select></div></div></section>
<section class="card"><h2 class="title"><span class="num">2</span>Productos</h2><div class="products" style="overflow-x:auto"><table><thead><tr><th>Descripción</th><th style="width:60px">Cant.</th><th style="width:80px">Medida</th><th>Obs.</th><th style="width:30px"></th></tr></thead><tbody id="productBody"></tbody></table></div><div class="actions"><button class="btn secondary" id="addProduct">+ Agregar</button></div></section>
<section class="card"><h2 class="title"><span class="num">3</span>Acciones</h2><div class="field"><label>Notas Generales / Motivo Devolución</label><textarea id="notes"></textarea></div><div class="actions"><button class="btn primary" id="sendBtn">Enviar a Alistador</button><button class="btn secondary" id="confirmClientBtn" style="display:none">Confirmar con Cliente y Enviar a Facturación</button><button class="btn outline" onclick="location.reload()">Nuevo Pedido</button></div><div id="result" class="result"></div></section>
<section class="card"><h2 class="title"><span class="num">H</span>Historial (Últimos 10 Entregados)</h2><div id="historyList"></div><p class="hint" style="text-align:center;margin-top:10px">Para ver más, consulte el <a href="https://docs.google.com/spreadsheets/d/1Ss489nCNsh7eeyW-_VRk_yDZAmrSbukbvhpxkkdsuRg/edit?usp=sharing" target="_blank">Excel</a>.</p></section>
</main>
<script>
const $=id=>document.getElementById(id);let products=[];
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzU-S4moXhirw1AHlq3AJM0IebBIxHZ60r0PbRRGIbNwNaNl7YiKoYT4Zjyi3U4von6/exec';
function genId() {
    const d = new Date();
    const pad = n => n.toString().padStart(2, '0');
    const fecha = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
    const hora = `${pad(d.getHours())}${pad(d.getMinutes())}`;
    const rnd = Math.random().toString(36).substring(2,5).toUpperCase();
    return `SOL-${fecha}-${hora}-${rnd}`;
}
$('consecutive').value=genId();
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!products.length)products=[{d:'',q:1,m:'Unidad',o:''}];$('productBody').innerHTML=products.map((p,i)=>`<tr><td><input data-p="${i}" data-k="d" value="${esc(p.d)}"></td><td><input type="number" data-p="${i}" data-k="q" value="${p.q}"></td><td><select data-p="${i}" data-k="m"><option ${p.m==='Unidad'?'selected':''}>Unidad</option><option ${p.m==='Metro'?'selected':''}>Metro</option><option ${p.m==='Rollo'?'selected':''}>Rollo</option></select></td><td><input data-p="${i}" data-k="o" value="${esc(p.o)}"></td><td><button class="row-remove" onclick="remove(${i})">×</button></td></tr>`).join('');$('productBody').querySelectorAll('input,select').forEach(e=>e.oninput=()=>{products[+e.dataset.p][e.dataset.k]=e.value})}
function remove(i){products.splice(i,1);render()}
function load(){
    fetch(`${SCRIPT_URL}?action=obtenerDevueltosVendedor`).then(r=>r.json()).then(data=>{
        $('devueltosList').innerHTML=data.length?data.map(o=>`<div class="list-item" onclick='fill(${JSON.stringify(o)})'><strong>${o.id}</strong> - ${o.name}<br><span class="status-badge status-devuelto">Devuelto: ${o.notes}</span></div>`).join(''):'<p class="hint">No hay devoluciones pendientes.</p>';
    });
    fetch(`${SCRIPT_URL}?action=obtenerHistorial`).then(r=>r.json()).then(data=>{
        $('historyList').innerHTML=data.map(o=>`<div style="padding:8px;border-bottom:1px solid #eee;font-size:12px"><strong>${o.id}</strong> - ${o.name} <span class="status-badge status-entregado">Entregado</span></div>`).join('');
    });
}
function fill(o){
    $('consecutive').value=o.id; $('nit').value=o.nit; $('name').value=o.name; $('address').value=o.address;
    $('city').value=o.city; $('neighborhood').value=o.neighborhood; $('phone').value=o.phone;
    $('priceList').value=o.priceList; products=o.products; $('notes').value=o.notes; render();
    $('confirmClientBtn').style.display='inline-block'; $('sendBtn').style.display='none';
}
$('addProduct').onclick=()=>{products.push({d:'',q:1,m:'Unidad',o:''});render()};
$('sendBtn').onclick=()=>send('guardarPedido','Pedido enviado al Alistador.');
$('confirmClientBtn').onclick=()=>send('confirmarDespacho','Confirmado con cliente. Enviado a Facturación.');
function send(act,msg){
    const data={action:act,id:$('consecutive').value,nit:$('nit').value,name:$('name').value,address:$('address').value,city:$('city').value,neighborhood:$('neighborhood').value,phone:$('phone').value,priceList:$('priceList').value,products:products,notes:$('notes').value};
    
    // Deshabilitar botones mientras carga
    $('sendBtn').disabled = true;
    if($('confirmClientBtn'))$('confirmClientBtn').disabled = true;

    fetch(SCRIPT_URL,{
        method:'POST',
        redirect: 'follow', // Obligatorio
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Obligatorio
        body:JSON.stringify(data)
    }).then(()=>{
        $('result').style.display='block';$('result').innerText=msg;
        setTimeout(()=>location.reload(),2000);
    }).catch(e => {
        console.error(e);
        $('result').style.display='block';$('result').innerText='Error de conexión.';
        $('sendBtn').disabled = false;
        if($('confirmClientBtn'))$('confirmClientBtn').disabled = false;
    });
}
render(); load();
</script></body></html>
