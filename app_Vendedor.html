<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ · Vendedor</title>
<style>
:root{--green:#157347;--green-dark:#0b432b;--lime:#dff2e6;--ink:#1f2937;--muted:#667085;--line:#d0d5dd;--bg:#f1f5f3;--card:#fff;--amber:#fff5d6;--amber-line:#e3b341;--red:#b42318;--shadow:0 12px 26px #102a1d12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:800px;margin:auto;padding:24px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(145deg,#2cac64,#0b432b);display:grid;place-items:center;color:white;font-weight:900;font-size:18px}.eyebrow{color:var(--green);text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:.08em}h1{margin:0;font-size:22px}.card{background:var(--card);border:1px solid #e3e7e5;border-radius:17px;padding:19px;box-shadow:var(--shadow);margin-bottom:17px}.title{display:flex;align-items:center;gap:9px;margin:0 0 15px;font-size:16px}.num{width:24px;height:24px;border-radius:7px;background:var(--lime);color:var(--green-dark);display:grid;place-items:center;font-weight:900;font-size:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:10px;font-weight:900;text-transform:uppercase;color:#475467;letter-spacing:.03em}input,select,textarea{width:100%;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--lime)}textarea{min-height:60px;resize:vertical}.hint{color:var(--muted);font-size:12px;line-height:1.45}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:900;font-size:13px;cursor:pointer;transition:transform .16s,filter .16s}.btn:active{transform:scale(.97)}.primary{background:var(--green);color:#fff}.secondary{background:var(--lime);color:var(--green-dark)}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.products{margin-top:14px;border:1px solid #dce5de;border-radius:10px;overflow:auto}.products table{border-collapse:collapse;width:100%;min-width:600px}.products th{background:#f4f8f5;color:#475467;font-size:10px;text-transform:uppercase;padding:9px;text-align:left}.products td{padding:7px;border-top:1px solid #e8eeea}.row-remove{border:1px solid #f0c3bf;background:#fff;color:var(--red);width:28px;height:28px;border-radius:6px;cursor:pointer}.result{display:none;margin-top:13px;background:#eef8f1;border:1px solid #a9d9b8;padding:12px;border-radius:10px;font-weight:600;color:var(--green-dark)}@media(max-width:600px){.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="logo">DJ</div><div><div class="eyebrow">Distribuciones Johnson</div><h1>Captura de Pedido</h1></div></div></header>
<section class="card"><h2 class="title"><span class="num">1</span>Datos del Cliente</h2><div class="fields"><div class="field"><label for="consecutive">Consecutivo</label><input id="consecutive" readonly></div><div class="field"><label for="nit">NIT / Documento</label><input id="nit" placeholder="Ingrese NIT"></div><div class="field full"><label for="name">Razón Social</label><input id="name" placeholder="Nombre del cliente"></div><div class="field full"><label for="address">Dirección</label><input id="address" placeholder="Dirección de entrega"></div><div class="field"><label for="city">Ciudad</label><input id="city" placeholder="Municipio"></div><div class="field"><label for="neighborhood">Barrio</label><input id="neighborhood" placeholder="Barrio"></div><div class="field"><label for="phone">Teléfono</label><input id="phone" placeholder="Celular"></div><div class="field"><label for="priceList">Lista de Precios</label><select id="priceList"><option value="1">Precio 1</option><option value="2">Precio 2</option><option value="3">Precio 3</option></select></div></div></section>
<section class="card"><h2 class="title"><span class="num">2</span>Productos</h2><div class="products"><table><thead><tr><th>Descripción</th><th style="width:80px">Cant.</th><th style="width:100px">Medida</th><th>Obs.</th><th style="width:40px"></th></tr></thead><tbody id="productBody"></tbody></table></div><div class="actions"><button class="btn secondary" id="addProduct">+ Agregar</button></div></section>
<section class="card"><h2 class="title"><span class="num">3</span>Envío</h2><div class="field"><label for="notes">Notas Generales</label><textarea id="notes" placeholder="Observaciones del pedido"></textarea></div><div class="actions"><button class="btn primary" id="sendBtn">Enviar Pedido al Alistador</button><button class="btn outline" id="clearBtn">Limpiar</button></div><div id="result" class="result"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
let products=[];
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxx7OVHrtMiIOsCB3tOt3Su7Z79q1GIlYhbURgye02DG7Z_j15slh28vUQMykxUOT4p/exec';
function generarIdUnico() {
    const marcaTiempo = Date.now().toString(36).toUpperCase(); 
    const aleatorio = Math.random().toString(36).substring(2, 5).toUpperCase();
    return `SOL-${marcaTiempo}-${aleatorio}`;
}
$('consecutive').value = generarIdUnico();

function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!products.length)products=[{d:'',q:1,m:'Unidad',o:''}];$('productBody').innerHTML=products.map((p,i)=>`<tr><td><input data-p="${i}" data-k="d" value="${esc(p.d)}"></td><td><input type="number" data-p="${i}" data-k="q" value="${esc(p.q)}"></td><td><select data-p="${i}" data-k="m"><option ${p.m==='Unidad'?'selected':''}>Unidad</option><option ${p.m==='Metro'?'selected':''}>Metro</option><option ${p.m==='Rollo'?'selected':''}>Rollo</option></select></td><td><input data-p="${i}" data-k="o" value="${esc(p.o)}"></td><td><button class="row-remove" onclick="remove(${i})">×</button></td></tr>`).join('');$('productBody').querySelectorAll('input,select').forEach(e=>e.oninput=()=>{products[+e.dataset.p][e.dataset.k]=e.value})}
function remove(i){products.splice(i,1);render()}
$('addProduct').onclick=()=>{products.push({d:'',q:1,m:'Unidad',o:''});render()};
$('clearBtn').onclick=()=>{if(confirm('¿Limpiar formulario?'))location.reload()};

$('sendBtn').onclick=()=>{
    const data={
        action: 'guardarPedido',
        id:$('consecutive').value, nit:$('nit').value, name:$('name').value, address:$('address').value,
        city:$('city').value, neighborhood:$('neighborhood').value, phone:$('phone').value,
        priceList:$('priceList').value, products:products, notes:$('notes').value, status:'Pendiente', date:new Date().toLocaleString()
    };
    
    $('sendBtn').disabled = true;
    $('sendBtn').innerText = 'Enviando...';
    
    fetch(SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow', // Obligatorio para las redirecciones de Google
        headers: {
            'Content-Type': 'text/plain;charset=utf-8' // Clave para evitar el error CORS
        },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(response => {
        $('result').style.display='block'; 
        $('result').innerText='Pedido enviado correctamente al Alistador.';
        setTimeout(()=>location.reload(), 2000);
    })
    .catch(error => {
        console.error('Error:', error);
        $('result').style.display='block'; 
        $('result').style.color='var(--red)';
        $('result').innerText='Error al enviar el pedido. Revisa la consola.';
        $('sendBtn').disabled = false;
        $('sendBtn').innerText = 'Enviar Pedido al Alistador';
    });
};
render();
</script></body></html>
